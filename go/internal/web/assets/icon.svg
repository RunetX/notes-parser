<!-- Значок вкладки — зеркало из шапки (base.gohtml, .mark) КОНТУРОМ и без
     плашки. Третья редакция за день, и обе прежние отвергнуты владельцем:
     контур в плашке «не считывается» (на 16 точках рамка занимает полторы
     точки, внутри остаётся четыре, и туда же должен лечь блик), а заливка
     «выглядит очень мрачно, и толщина линий не ассоциируется с зеркалом».
     Зеркало и правда вещь тонкая: узнаётся оно ЛИНИЕЙ, а не пятном.

     Плашки нет вовсе, поэтому знак занимает всё поле — рамка выросла с 13 до
     18 при том же отношении 1,41, и линия в 16 точек читается, оставаясь
     линией. Цена решения: без плашки цвет знака обязан жить и на белой полосе
     вкладок, и на тёмной, поэтому он не белый (как в шапке), а синий токен
     палитры (light, ссылка): 3,4 к белому и 4,4 к тёмной полосе.

     Проверяется это РЕНДЕРОМ в 16 точек на трёх полосах вкладок, а не видом в
     редакторе: в 64 точки читаются все варианты, и разница видна только там,
     где значок живёт.

     Комментарий этот читает БРАУЗЕР, а не Go: файл отдаётся как есть, значит он
     обязан быть правильным XML. Двойного дефиса внутри комментария XML не
     допускает, поэтому имена токенов названы здесь словами. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect x="7" y="3.3" width="18" height="25.4" rx="9" fill="none" stroke="#448dc8" stroke-width="3"/>
  <path d="M12.6 12.2 18 17.5" fill="none" stroke="#448dc8" stroke-width="2.2" stroke-linecap="round"/>
</svg>

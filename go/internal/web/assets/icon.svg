<!-- Значок вкладки — ТОТ ЖЕ ЗНАК, что в шапке (base.gohtml, .mark): зеркало,
     рамка с бликом. До 01.09.2026 здесь стояли три белые полосы на синем
     квадрате — значок ленты вообще, не совпадавший на площадке ни с чем.

     Пропорции сняты с шапки, а не подобраны на глаз: там рамка 12,2 × 17,2
     (отношение 1,41) и блик идёт от трети ширины к двум третям — здесь то же
     самое, пересчитанное на 13 × 18,5. Линии толще (3 против 1,8): рисуется
     этот знак в 16 точек, а не в 20.

     Плашка у него своя, потому что на вкладке за знаком нет шапки: белое
     зеркало пропало бы на светлой полосе вкладок. Цвета — самой шапки в теме
     по умолчанию (токены nav и nav-ink графита), то есть на вкладке стоит
     ровно то, что человек увидит наверху страницы.

     Комментарий этот ЧИТАЕТ БРАУЗЕР, а не Go: файл отдаётся как есть, значит
     он обязан быть правильным XML. Двойного дефиса внутри комментария XML не
     допускает, поэтому имена токенов названы здесь без него. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2f363e"/>
  <rect x="9.5" y="6.5" width="13" height="18.5" rx="6.5" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M13.5 13 17.4 16.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>

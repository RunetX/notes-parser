<!-- Значок вкладки — зеркало из шапки (base.gohtml, .mark), но ЗАЛИТОЕ, а не
     контуром. Жалоба владельца 01.09.2026: контурный знак «на вкладке не
     считывается», и причина у этого арифметическая, а не вкусовая — на 16
     точках рамка занимает полторы точки, внутри неё остаётся четыре, и в эти
     четыре должен лечь ещё и блик.

     Отсюда размен: композиция шапки сохранена (те же пропорции 1,41, блик из
     левого верха к середине), а фигура и фон поменялись местами — белое тело
     зеркала держит форму и в 16 точек, блик прорезан цветом плашки. Проверялось
     РЕНДЕРОМ в 16 точек на белой, серой и тёмной полосе вкладок, а не на глаз в
     редакторе: в 64 точки читаются оба варианта одинаково, и разница видна
     только там, где значок живёт.

     Плашка нужна потому, что на вкладке за знаком нет шапки: белое зеркало
     пропало бы на светлой полосе. Цвета — самой шапки в теме по умолчанию
     (графит), то есть на вкладке стои́т то же, что человек увидит наверху
     страницы.

     Комментарий этот читает БРАУЗЕР, а не Go: файл отдаётся как есть, значит он
     обязан быть правильным XML. Двойного дефиса внутри комментария XML не
     допускает, поэтому имена токенов названы здесь словами. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2f363e"/>
  <rect x="7.5" y="4" width="17" height="24" rx="8.5" fill="#fff"/>
  <path d="M12.8 12.4 17.9 17.4" fill="none" stroke="#2f363e" stroke-width="3.4" stroke-linecap="round"/>
</svg>

# Проверки на каждый push и pull request.
#
# Зачем это здесь, если тесты и так гоняются руками: половина решений пакета
# `platform` живёт в SQL, и проверяются они ТОЛЬКО против настоящего Postgres —
# а на рабочей машине его нет, и тесты идут по ssh-туннелю к боевому хосту (две
# минуты, почти целиком сетевые задержки). Здесь база поднимается сервисным
# контейнером рядом с раннером, поэтому интеграционный набор перестаёт быть
# «когда руки дойдут».
#
# Секретов у этого workflow нет вовсе и быть не должно: репозиторий публичный, а
# pull request из форка выполняет чужой код. Всё, что требует доступа к хосту,
# живёт в deploy.yml и запускается только кнопкой.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

# Гонять два прогона на один и тот же коммит незачем: новый push отменяет
# предыдущий, а на main отмены нет — там прогон и есть запись о том, что коммит
# проверен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: build, vet, тесты без Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Без LOVEGW_TEST_PG_DSN интеграционные наборы пропускаются сами — это то
      # же, что видит человек на машине без базы.
      - run: go test ./...

  postgres:
    name: тесты против настоящего Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    services:
      postgres:
        # Та же версия, что в бою (deploy/platform/docker-compose.yml): планы
        # запросов — часть контракта, и проверять их на другой мажорной версии
        # значит проверять другую базу.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          # Имя обязано содержать «test»: тесты сносят схему целиком, и на этом
          # стоит предохранитель в pg_test.go. Здесь база одноразовая, но имя
          # держим таким же, чтобы предохранитель проверялся тоже.
          POSTGRES_DB: platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Схему накатывают сами тесты (DROP SCHEMA + Migrate перед каждым),
      # поэтому отдельного шага миграций здесь нет и быть не должно.
      - run: go test ./internal/platform/ ./internal/platsink/
        env:
          LOVEGW_TEST_PG_DSN: postgres://platform:platform@127.0.0.1:5432/platform_test?sslmode=disable

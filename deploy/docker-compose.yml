# Развёртывание lovegw одним сервисом. Запускать из каталога deploy/.
# Хост-требование: российский IP (сайт love.ngs.ru отдаёт 403 c не-RU IP).
# Telegram при этом идёт через SOCKS5-прокси (см. telegram_proxy / LOVEGW_TG_PROXY).

services:
  lovegw:
    build:
      context: ../go
    image: lovegw:latest
    container_name: lovegw
    restart: unless-stopped
    volumes:
      # БД SQLite живёт в named volume, а не в bind-mount с хоста: на Windows
      # bind-mount не даёт надёжных блокировок/fsync, и база регулярно
      # приходила в «database disk image is malformed» (29 и 30 июля 2026).
      # Том должен быть записываем uid 65532 (distroless nonroot).
      # Доступ к файлу: docker cp lovegw:/data/lovegw.db .
      - lovegw-data:/data
      - ./config.json:/config.json:ro # конфиг: каналы, подпись, прокси; токены можно вынести в env
    # Секреты можно держать не в config.json, а в env (перебивают конфиг):
    # env_file:
    #   - ./secrets.env

volumes:
  lovegw-data:

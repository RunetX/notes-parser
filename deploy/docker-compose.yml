# Развёртывание lovegw: демон и три наблюдателя. Запускать из каталога deploy/.
# Хост-требование: российский IP (сайт love.ngs.ru отдаёт 403 c не-RU IP).
# Telegram при этом идёт через SOCKS5-прокси (см. telegram_proxy / LOVEGW_TG_PROXY).

# Общий якорь ограничений. Все четыре сервиса — один бинарник, который ходит по
# сети и пишет только в /data: своя ФС ему не нужна (read_only тома не трогает),
# привилегии не нужны тем более. Временных файлов проект не создаёт (конвертация
# голосовых идёт пайпом), но /tmp отдан под tmpfs — на случай, если библиотеке
# понадобится скретч.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m

services:
  lovegw:
    build:
      context: ../go
    image: lovegw:latest
    container_name: lovegw
    restart: unless-stopped
    <<: *hardening
    volumes:
      # БД SQLite и файлы дайджеста лежат в ./data на хосте. Bind-mount годится
      # на Linux; порча базы («database disk image is malformed», 29 и 30 июля
      # 2026) случалась на Windows-хосте, где bind-mount не даёт надёжных
      # блокировок/fsync — там нужен named volume.
      # Каталог должен быть записываем uid 65532 (distroless nonroot):
      #   mkdir -p data && sudo chown -R 65532:65532 data
      - ./data:/data
      - ./config.json:/config.json:ro # конфиг: каналы, подпись, прокси; токены можно вынести в env
    # Секреты можно держать не в config.json, а в env (перебивают конфиг):
    # env_file:
    #   - ./secrets.env
    # Если куки в базе зашифрованы (`lovegw secrets encrypt`), в secrets.env
    # обязан лежать LOVEGW_SECRET_KEY: без него демон не стартует — это
    # намеренно, иначе он молча выдал бы всем «сессия истекла, нужен /login».

  # Наблюдатель за действиями модерации: та же картинка, отдельная БД
  # (data/modwatch.db), только чтение сайта. Боевую БД не трогает, поэтому
  # переживает любые операции с демоном. Из конфига берёт лишь параметры
  # сайта и уровень лога — токены ему не нужны.
  modwatch:
    # Своего build здесь НЕТ намеренно: образ тот же, что у демона, а compose
    # собирает сервисы параллельно — два блока build с одним контекстом
    # стартовали одновременно, оба промахивались мимо кэша и компилировали
    # проект дважды (на боевом VPS это удваивало 25-минутную сборку).
    image: lovegw:latest
    container_name: lovegw-modwatch
    restart: unless-stopped
    <<: *hardening
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "watch"]
    volumes:
      - ./data:/data
      - ./config.json:/config.json:ro

  # Визиты в анкету владельца — единственный след, который оставляет модератор:
  # наказывает он молча, но перед этим открывает анкету (бан 12.08.2026 в 19:38
  # и визит Гадёныша в 19:38 совпали минута в минуту). Снимать надо регулярно:
  # сайт держит одну строку на человека и при повторном визите затирает прежнюю.
  # Ходит под сессией владельца из lovegw.db, пишет в ту же modwatch.db.
  guests:
    image: lovegw:latest
    container_name: lovegw-guests
    restart: unless-stopped
    <<: *hardening
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "guests", "watch"]
    volumes:
      - ./data:/data
      - ./config.json:/config.json:ro
    # Сессию владельца этот сервис читает из lovegw.db, поэтому при включённом
    # шифровании ему нужен тот же ключ, что и демону (сервису modwatch — нет:
    # он ходит на сайт анонимно).
    # env_file:
    #   - ./secrets.env

  # Присутствие людей на сайте: детектор запретов в «Заметки». Запрет ничего не
  # убирает с площадки, поэтому наблюдатель за модерацией его не видит — зато
  # анкета показывает время последнего действия человека. Замолчал и продолжает
  # заходить — закрыли; замолчал и не заходит — ушёл сам.
  # Круг наблюдения берётся из зеркала (lovegw.db, только реплики — ключ
  # шифрования не нужен), отметки пишутся в modwatch.db. Обход анонимный, под
  # мобильным vhost и строгим темпом: сессия сюда не носится.
  activity:
    image: lovegw:latest
    container_name: lovegw-activity
    restart: unless-stopped
    <<: *hardening
    # -users — известные модераторы (Гадёныш, Хатуль мадан): их анкеты
    # опрашиваются КАЖДЫЙ такт, а не по очереди со всеми, поэтому присутствие
    # снимается с десятиминутной сеткой и его можно сверить с минутой удаления
    # (`activity log -near`). Круг набирается по комментариям, а модератор
    # может и не комментировать — тогда сам он в него не попадёт.
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "activity", "watch", "-users", "175869,606064"]
    volumes:
      - ./data:/data
      - ./config.json:/config.json:ro

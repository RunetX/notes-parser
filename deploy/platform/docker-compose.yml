# Всё развёртывание одним файлом: демон зеркала с тремя наблюдателями и
# площадка (Postgres, веб-морда, реверс-прокси с TLS). Семь сервисов из ОДНОГО
# образа `lovegw:latest` — он собирается вокруг готового бинарника
# (Dockerfile.prebuilt), потому что на одном ядре `go build` идёт 25 минут и
# уронил бы всё, что на этом хосте работает.
#
# Слились они 17.08.2026 вместе с переездом демона со старого VPS. До переезда
# файлов было два, и это было вынужденно: два экземпляра ботов на одних токенах
# дают 409 на `getUpdates` и дубли в канале, поэтому демон нельзя было поднять
# здесь, пока он работал там. Обратная сторона — площадку наполняет fan-out
# ВНУТРИ демона, значит писать в Postgres обязан тот же процесс, что зеркалит:
# портов у базы наружу нет и не будет.
#
# Имя проекта задано явно (`name: platform`), а не берётся от каталога: в нём
# зашиты имена томов, а в томах — база и сертификаты ACME. Переложи файл в
# другой каталог без этой строки — и compose молча заведёт пустые тома.
#
# Хост-требование: российский IP (love.ngs.ru отдаёт 403 остальному миру), а
# Bot API из России блокируется — он идёт через SOCKS5 (`telegram_proxy`).

name: platform

# Общий якорь ограничений — только то, что верно для ВСЕХ, включая Postgres.
# read_only сюда не входит: наш бинарник своей ФС не требует, а Postgres без неё
# не живёт, и общий якорь с read_only тихо отправил бы базу в рестарт-петлю.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# Демон и наблюдатели: один образ, один каталог данных, один конфиг.
x-daemon: &daemon
  image: lovegw:latest
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m
  volumes:
    - ./data:/data
    # Конфиг демона ОТДЕЛЬНЫЙ от конфига веб-морды: здесь токены ботов, ключ
    # шифрования кук и ключи LLM/ASR, а веб-морда смотрит в интернет. Общий
    # файл отдал бы ей всё это без всякой нужды.
    - ./lovegw.json:/config.json:ro

services:
  postgres:
    image: postgres:18-alpine
    container_name: platform-pg
    restart: unless-stopped
    <<: *hardening
    # Общий якорь снимает ВСЕ привилегии — он писался под distroless-бинарник,
    # которому и не нужно ничего. Официальный образ Postgres устроен иначе:
    # стартует от root, готовит каталоги и переключается на пользователя
    # postgres, поэтому без этих четырёх он вечно перезапускается с
    # «chown: Operation not permitted». Возвращаем ровно их, а не всё подряд.
    # DAC_OVERRIDE здесь же: без него root внутри контейнера не может обойти
    # права на каталогах данных и падает на «find: Permission denied».
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    # Портов НЕТ намеренно: база доступна только по внутренней сети compose.
    # Открытый наружу 5432 — самый дешёвый способ отдать всю базу целиком.
    volumes:
      # Именованный том, а не bind-mount: на bind-mount проект уже дважды ловил
      # «database disk image is malformed» (29 и 30 июля 2026, SQLite на
      # Windows-хосте). Postgres к тому же требователен к правам и fsync.
      #
      # Монтируется /var/lib/postgresql ЦЕЛИКОМ, а не .../data. В postgres:18
      # PGDATA переехал в /var/lib/postgresql/18/docker, и привычный по прошлым
      # версиям путь .../data теперь бьёт мимо данных: контейнер поднимается,
      # работает, а база живёт в анонимном томе и исчезает при пересоздании.
      # Точка монтирования, объявленная самим образом, — именно эта.
      - pgdata:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
    env_file: [./secrets.env] # POSTGRES_PASSWORD, LOVEGW_PLATFORM_DSN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------ зеркало
  # Демон: лента → каналы, мост ответов на сайт, ЛС-боты, амвон, дайджест,
  # личная переписка — и с 17.08.2026 площадка третьим приёмником.
  lovegw:
    <<: *daemon
    container_name: lovegw
    command: ["run", "-config", "/config.json"]
    # DSN площадки (с паролем) держим в env, а не в конфиге: конфиг монтируется
    # файлом и попадает в бэкапы каталога развёртывания.
    env_file: [./secrets.env]
    # Ждём базу: приёмник открывает пул на старте, и недоступный Postgres —
    # отказ демона (лечится рестарт-политикой). Разошедшаяся схема ведёт себя
    # иначе, она демон не роняет, — см. deploy/platform/README.md.
    depends_on:
      postgres:
        condition: service_healthy

  # Наблюдатель за действиями модерации: своя БД (data/modwatch.db), сайт
  # только читается. Боевую БД не трогает, поэтому переживает любые операции с
  # демоном. Из конфига берёт лишь параметры сайта и уровень лога.
  modwatch:
    <<: *daemon
    container_name: lovegw-modwatch
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "watch"]

  # Визиты в анкету владельца — единственный след, который оставляет модератор:
  # наказывает он молча, но перед этим открывает анкету. Снимать надо
  # регулярно: сайт держит одну строку на человека и затирает её при повторном
  # визите. Ходит под сессией владельца из lovegw.db (значит нужен ключ
  # шифрования — он в конфиге), пишет в ту же modwatch.db.
  guests:
    <<: *daemon
    container_name: lovegw-guests
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "guests", "watch"]

  # Присутствие людей на сайте: детектор запретов в «Заметки». Запрет ничего не
  # убирает с площадки, поэтому наблюдатель за модерацией его не видит — зато
  # анкета показывает время последнего действия. Замолчал и продолжает
  # заходить — закрыли; замолчал и не заходит — ушёл сам.
  # -users — известные модераторы: их анкеты опрашиваются КАЖДЫЙ такт, а не по
  # очереди со всеми, иначе присутствие не сверить с минутой удаления.
  activity:
    <<: *daemon
    container_name: lovegw-activity
    command: ["modwatch", "-config", "/config.json", "-db", "/data/modwatch.db", "activity", "watch", "-users", "175869,606064"]

  # ------------------------------------------------------------ площадка
  platform:
    image: lovegw:latest
    container_name: platform-web
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m
    command: ["web", "-config", "/config.json"]
    # Портов тоже НЕТ: наружу выпускает только caddy.
    volumes:
      - ./data:/data # /data/media — файловое хранилище (CAS)
      - ./config.json:/config.json:ro
    env_file: [./secrets.env]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: platform-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # сертификаты ACME — их нельзя терять при пересоздании
      - caddy_config:/config
      # Медиа отдаёт Caddy напрямую, мимо Go: на одном ядре самый жирный по
      # трафику путь не должен проходить через приложение.
      - ./data/media:/srv/media:ro
    depends_on: [platform]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

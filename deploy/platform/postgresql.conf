# Postgres площадки. Хост: 1 ядро, 1,6 ГиБ RAM фактически, диск ~490 МБ/с (SSD).
# Значения подобраны под это железо, а не «по умолчанию для сервера».

listen_addresses = '*'
max_connections = 20                  # пул приложения — 8; остальное на обслуживание

# --- память ---
# shared_buffers 384 МБ, а не 512: физической памяти 1,6 ГиБ, а не 2, и отдать
# треть под кэш страниц Postgres при живущих рядом веб-морде и демоне — предел.
shared_buffers = 384MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 96MB

# --- одно ядро ---
# JIT и параллелизм на одном ядре сжигают процессор на запросах, живущих две
# миллисекунды: компиляция плана дороже самого плана.
jit = off
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_worker_processes = 4

# --- диск ---
random_page_cost = 1.1                # SSD: замер dd oflag=direct дал 491 МБ/с
effective_io_concurrency = 200
# synchronous_commit = on осознанно: потерянные при сбое 200 мс — это потерянный
# комментарий живого человека, а пиковая запись у нас 1–3 транзакции в секунду.
synchronous_commit = on
wal_compression = zstd
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 128MB

# --- обслуживание ---
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- поиск ---
# Задел под поиск с русской морфологией: «заметки» должны находить «заметка».
# Ради этого и выбран Postgres, а не SQLite с FTS5 (unicode61 не умеет стемминг).
default_text_search_config = 'pg_catalog.russian'

# --- наблюдаемость ---
log_min_duration_statement = 200ms
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on

# Время храним в UTC, показываем новосибирское — как на сайте.
timezone = 'UTC'
